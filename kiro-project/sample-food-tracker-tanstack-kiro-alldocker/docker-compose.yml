services:
  app:
    build: .
    container_name: foodstarter-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://username:password@postgres:5432/mydb
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
      - aws_credentials:/root/.aws
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - foodstarter
    command: sh -c "pnpm db:migrate && pnpm db:seed && pnpm dev --host 0.0.0.0"

  postgres:
    image: postgres:17-alpine
    container_name: foodstarter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - foodstarter
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  foodstarter:
    driver: bridge

volumes:
  postgres_data:
  aws_credentials:
