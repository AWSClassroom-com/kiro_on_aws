<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="foodPattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Apple -->
      <circle cx="30" cy="30" r="8" fill="#10b981" opacity="0.1"/>
      <path d="M30 22c-4 0-8 3-8 8s4 8 8 8 8-3 8-8-4-8-8-8z" fill="#10b981" opacity="0.15"/>
      
      <!-- Carrot -->
      <path d="M90 25l-3 15c0 2 1 3 3 3s3-1 3-3l-3-15z" fill="#f97316" opacity="0.1"/>
      
      <!-- Leaf -->
      <path d="M60 90c0-5 3-8 8-8s8 3 8 8-8 12-8 12-8-7-8-12z" fill="#22c55e" opacity="0.12"/>
    </pattern>
    
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.05"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="600" fill="url(#heroGradient)"/>
  <rect width="1200" height="600" fill="url(#foodPattern)"/>
  
  <!-- Floating food icons -->
  <g opacity="0.1">
    <circle cx="200" cy="150" r="12" fill="#10b981"/>
    <circle cx="800" cy="100" r="8" fill="#f97316"/>
    <circle cx="1000" cy="200" r="10" fill="#22c55e"/>
    <circle cx="300" cy="400" r="6" fill="#06b6d4"/>
    <circle cx="900" cy="450" r="14" fill="#8b5cf6"/>
    <circle cx="150" cy="500" r="9" fill="#f59e0b"/>
  </g>
</svg>